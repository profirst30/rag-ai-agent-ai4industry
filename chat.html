<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Groupe 3 - Otoroshi</title>
    <style>
        /* Design propre style "Dark Mode" ou moderne */
        body { font-family: 'Inter', sans-serif; background-color: #1a1a1a; color: white; margin: 0; display: flex; justify-content: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 600px; background: #2d2d2d; display: flex; flex-direction: column; height: 100%; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        /* En-tête */
        .header { background: #f39c12; color: #fff; padding: 20px; font-weight: bold; text-align: center; font-size: 1.2rem; }

        /* Zone des messages */
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }

        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 15px; word-wrap: break-word; }
        .user { align-self: flex-end; background-color: #f39c12; color: white; border-bottom-right-radius: 2px; }
        .bot { align-self: flex-start; background-color: #444; color: #ddd; border-bottom-left-radius: 2px; }
        .loading { font-style: italic; opacity: 0.7; font-size: 0.9em; }

        /* Zone de saisie */
        .input-area { display: flex; padding: 15px; background: #333; border-top: 1px solid #444; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: none; background: #444; color: white; outline: none; font-size: 16px; margin-right: 10px; }
        button { padding: 10px 25px; background: #f39c12; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #e67e22; }
        button:disabled { background: #7f8c8d; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">IA Groupe 3 (Via Otoroshi)</div>
    <div id="messages">
        <div class="message bot">Bonjour ! Je suis connecté via Otoroshi. Pose-moi une question !</div>
    </div>

    <form class="input-area" id="chatForm">
        <input type="text" id="userInput" placeholder="Écrivez votre message..." autocomplete="off">
        <button type="submit" id="sendBtn">Envoyer</button>
    </form>
</div>

<script>
    const form = document.getElementById('chatForm');
    const input = document.getElementById('userInput');
    const messagesDiv = document.getElementById('messages');
    const sendBtn = document.getElementById('sendBtn');

    // CONFIGURATION
    // On tape sur l'URL publique d'Otoroshi
    const API_URL = 'http://ai4industry.oto.tools:8080/v1/chat/completions';

    // C'est ICI qu'on met la clé, car c'est le navigateur qui va faire l'appel
    const API_KEY = 'Bearer otoapk_w2np3b9v9zxvr659_7daf5d6ffd4fa0c3b4a78c1290301975275f3549538cf436332b6f6d6b85e397';

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerText = text;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        return div;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        // 1. Affiche le message de l'utilisateur
        addMessage(text, 'user');
        input.value = '';
        input.disabled = true;
        sendBtn.disabled = true;

        // Bulle de chargement temporaire
        const loadingBubble = addMessage("En train d'écrire...", 'bot loading');

        try {
            // 2. Appel à l'API via Otoroshi
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': API_KEY // La clé passe ici !
                },
                body: JSON.stringify({
                    messages: [
                        { role: "user", content: text }
                    ]
                })
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`Erreur Otoroshi (${response.status}): ${errText}`);
            }

            const data = await response.json();
            const botReply = data.choices[0].message.content;

            // On remplace le chargement par la vraie réponse
            loadingBubble.remove();
            addMessage(botReply, 'bot');

        } catch (error) {
            loadingBubble.remove();
            addMessage("Erreur : " + error.message, 'bot');
            console.error(error);
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    });
</script>

</body>
</html>
